<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>碳酸锂 — 席位交叉分析</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
:root {
    --bg: #0b1220; --bg2: #111827; --bg3: #1a2235;
    --border: #2a3452; --text: #c8d6e5; --dim: #636e85;
    --up: #22c55e; --down: #ef4444; --accent: #3b82f6;
    --gold: #f59e0b; --cyan: #06b6d4; --purple: #a855f7;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); min-height:100vh; }
[contextmenu],selectstart,dragstart,copy,cut,paste{user-select:none!important;-webkit-user-select:none!important;pointer-events:none!important;}
body { -webkit-user-select:none; }
body { -webkit-user-drag:none; }
body { -khtml-user-select:none; }

header { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
header h1 { font-size: 18px; font-weight: 600; color: #f1f5f9; }
header h1 span { color: var(--gold); margin-right: 8px; }
header .subtitle { font-size: 12px; color: var(--dim); }
header .refresh-btn { background: var(--accent); color: #fff; border: none; padding: 6px 16px; border-radius: 4px; cursor: pointer; font-size: 12px; }
header .refresh-btn:hover { opacity: .85; }

.date-bar { padding: 10px 24px; background: var(--bg2); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; font-size: 13px; flex-wrap: wrap; }
.date-bar label { color: var(--dim); }
.date-bar select { background: var(--bg3); color: var(--text); border: 1px solid var(--border); padding: 4px 10px; border-radius: 4px; font-size: 12px; }
.date-bar .date-info { margin-left: auto; color: var(--accent); font-size: 13px; }

.tabs { display: flex; padding: 0 24px; background: var(--bg2); border-bottom: 1px solid var(--border); overflow-x: auto; }
.tab { padding: 10px 18px; cursor: pointer; font-size: 13px; color: var(--dim); border-bottom: 2px solid transparent; white-space: nowrap; transition: all .2s; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

.container { padding: 20px 24px; }

.card { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
.card h3 { font-size: 14px; font-weight: 600; color: #e2e8f0; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }

.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--bg3); border-radius: 6px; padding: 12px; text-align: center; }
.kpi .label { font-size: 11px; color: var(--dim); margin-bottom: 4px; }
.kpi .value { font-size: 20px; font-weight: 700; }
.kpi .delta { font-size: 11px; margin-top: 2px; }
.up { color: var(--up); } .down { color: var(--down); }

.chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 960px) { .chart-row { grid-template-columns: 1fr; } }
.chart-box { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
.chart-box h4 { font-size: 13px; color: #94a3b8; margin-bottom: 8px; }
.chart { width: 100%; height: 300px; }
.chart.full { height: 380px; }

table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { background: var(--bg3); color: var(--dim); font-weight: 600; padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); position: sticky; top: 0; }
td { padding: 7px 10px; border-bottom: 1px solid #1e293b; }
tr:hover td { background: rgba(59,130,246,.06); }
.scroll-table { max-height: 450px; overflow-y: auto; }

.hint-card { background: var(--bg3); border-left: 3px solid var(--purple); border-radius: 0 6px 6px 0; padding: 10px 14px; margin-bottom: 8px; font-size: 12px; }
.hint-card .type { font-weight: 600; margin-right: 8px; }
.hint-net { font-weight: 600; }

.loading { text-align: center; padding: 40px; color: var(--dim); font-size: 14px; }
.loading::after { content: ''; display: inline-block; width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin-left: 10px; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }

.tag { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 10px; font-weight: 600; }
.tag-bullish { background: #22c55e20; color: #22c55e; }
.tag-bearish { background: #ef444420; color: #ef4444; }
.tag-directional { background: #f59e0b20; color: #f59e0b; }

.seat-selector { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.seat-chip { padding: 4px 12px; border-radius: 12px; font-size: 11px; cursor: pointer; border: 1px solid var(--border); color: var(--dim); transition: all .2s; }
.seat-chip:hover { border-color: var(--accent); color: var(--text); }
.seat-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
</style>
</head>
<body>

<header>
  <div>
    <h1><span>🔍</span>碳酸锂席位交叉分析</h1>
    <div class="subtitle">席位多空对比 · 净持仓排名 · 趋势追踪 · 投机/套保识别</div>
  </div>
  <button class="refresh-btn" onclick="loadAll()">🔄 刷新</button>
</header>

<div class="date-bar">
  <label>分析范围：</label>
  <select id="rangeSelect" onchange="changeRange()">
    <option value="all">全品种聚合（所有合约）</option>
    <option value="LC2609">LC2609 单合约</option>
    <option value="LC2609,LC2611">LC2609+LC2611</option>
    <option value="LC2609,LC2611,LC2612">LC2609+LC2611+LC2612</option>
  </select>
  <span class="date-info" id="latestDate">加载中...</span>
</div>

<div class="tabs" id="tabs">
  <div class="tab active" data-tab="ranking" onclick="switchTab('ranking')">① 净持仓排名</div>
  <div class="tab" data-tab="cross" onclick="switchTab('cross')">② 席位多空对比</div>
  <div class="tab" data-tab="trend" onclick="switchTab('trend')">③ 席位趋势</div>
  <div class="tab" data-tab="hints" onclick="switchTab('hints')">④ 投机/套保识别</div>
</div>

<div class="container" id="container">
  <div class="loading" id="loading">加载数据中</div>
</div>

<script>
let DATA = null;
let charts = {};
let currentTab = 'ranking';
let currentRange = 'all';
let selectedSeatForTrend = null;

function disposeCharts() {
    Object.values(charts).forEach(c => { if (c && !c.isDisposed()) c.dispose(); });
    charts = {};
}

function initChart(id, opt) {
    if (charts[id]) charts[id].dispose();
    const dom = document.getElementById(id);
    if (!dom) return null;
    dom.innerHTML = '';
    const c = echarts.init(dom, null, {renderer:'canvas'});
    c.setOption(opt, true);
    charts[id] = c;
    return c;
}

function fmt(n) { return n.toLocaleString('zh-CN'); }
function fmtShort(n) { if (Math.abs(n)>=1e4) return (n/1e4).toFixed(1)+'万'; return n.toString(); }
function deltaStr(d) { return (d>=0?'+':'')+d.toLocaleString('zh-CN'); }

const COLORS = ['#3b82f6','#ef4444','#22c55e','#f59e0b','#06b6d4','#8b5cf6','#ec4899','#14b8a6','#f97316','#6366f1','#84cc16','#e879f9'];

async function loadAll() {
    try {
        const params = currentRange === 'all' ? '' : '?contracts=' + currentRange;
        const res = await fetch('../api/seat_cross.json' + params);
        DATA = await res.json();
        document.getElementById('latestDate').textContent = '最新: ' + DATA.latest_date;
        switchTab(currentTab);
    } catch(e) {
        document.getElementById('loading').textContent = '❌ 加载失败: ' + e.message;
    }
}

function changeRange() {
    currentRange = document.getElementById('rangeSelect').value;
    loadAll();
}

function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
    const container = document.getElementById('container');
    if (!DATA) { container.innerHTML = '<div class="loading">加载中</div>'; return; }
    disposeCharts();
    switch(tab) {
        case 'ranking': renderRanking(container); break;
        case 'cross': renderCross(container); break;
        case 'trend': renderTrend(container); break;
        case 'hints': renderHints(container); break;
    }
}

function renderRanking(c) {
    const agg = DATA.seat_agg.slice(0, 25);
    const top15 = agg.slice(0, 15);
    const totalNet = agg.reduce((s,x)=>s+x.net, 0);

    c.innerHTML = `
      <div class="kpi-grid">
        <div class="kpi"><div class="label">席位总数</div><div class="value">${DATA.total_seats}</div></div>
        <div class="kpi"><div class="label">净持仓合计</div><div class="value ${totalNet>=0?'up':'down'}">${fmtShort(totalNet)}</div></div>
        <div class="kpi"><div class="label">净多最强</div><div class="value up">${top15[0]?.party_name || '-'}</div><div class="delta">${fmtShort(top15[0]?.net||0)}</div></div>
        <div class="kpi"><div class="label">净空最强</div><div class="value down">${agg[agg.length-1]?.party_name || '-'}</div><div class="delta">${fmtShort(agg[agg.length-1]?.net||0)}</div></div>
      </div>

      <div class="chart-row">
        <div class="chart-box"><h4>前15席位 净持仓排名</h4><div class="chart" id="netRankChart"></div></div>
        <div class="chart-box"><h4>前15席位 多头合计</h4><div class="chart" id="longRankChart"></div></div>
      </div>

      <div class="card"><h3>完整席位净持仓排名（前25）</h3>
        <div class="scroll-table"><table>
        <thead><tr><th>#</th><th>席位</th><th>总多头</th><th>总空头</th><th>净持仓</th><th>净占比</th><th>多头天数</th><th>空头天数</th></tr></thead><tbody>
        ${agg.map((s,i)=>{
            const total = s.total_long + s.total_short;
            const pctStr = total > 0 ? (s.net/total*100).toFixed(1)+'%' : '-';
            const netColor = s.net >= 0 ? 'up' : 'down';
            return `<tr>
                <td style="color:${i<3?'var(--gold)':'var(--dim)'}">${i+1}</td>
                <td style="font-weight:600">${s.party_name}</td>
                <td>${fmtShort(s.total_long)}</td>
                <td>${fmtShort(s.total_short)}</td>
                <td class="${netColor}" style="font-weight:700">${fmtShort(s.net)}</td>
                <td style="color:${netColor}">${pctStr}</td>
                <td>${s.long_days}</td>
                <td>${s.short_days}</td>
            </tr>`;
        }).join('')}
        </tbody></table></div></div>
    `;

    setTimeout(()=>{
        // Net ranking
        const top15Net = top15.slice().reverse();
        initChart('netRankChart', {
            tooltip:{trigger:'axis',axisPointer:{type:'shadow'}},
            grid:{left:100,right:60,top:10,bottom:30},
            xAxis:{type:'value',axisLabel:{formatter:v=>fmtShort(v),color:'#636e85'},splitLine:{lineStyle:{color:'#1e293b'}}},
            yAxis:{type:'category',data:top15Net.map(r=>r.party_name),axisLabel:{color:'#c8d6e5',fontSize:10}},
            series:[{
                type:'bar',data:top15Net.map(r=>({
                    value: r.net,
                    itemStyle:{color: r.net>=0 ? new echarts.graphic.LinearGradient(0,0,1,0,[{offset:0,color:'#22c55e88'},{offset:1,color:'#22c55e'}]) : new echarts.graphic.LinearGradient(0,0,1,0,[{offset:0,color:'#ef4444'},{offset:1,color:'#ef444488'}])}
                })),
                barWidth:16,
                label:{show:true,position:'right',fontSize:10,color:'#94a3b8',formatter:p=>fmtShort(p.value)}
            }]
        });

        // Long ranking
        const top15Long = top15.slice().reverse();
        initChart('longRankChart', {
            tooltip:{trigger:'axis',axisPointer:{type:'shadow'}},
            grid:{left:100,right:60,top:10,bottom:30},
            xAxis:{type:'value',axisLabel:{formatter:v=>fmtShort(v),color:'#636e85'},splitLine:{lineStyle:{color:'#1e293b'}}},
            yAxis:{type:'category',data:top15Long.map(r=>r.party_name),axisLabel:{color:'#c8d6e5',fontSize:10}},
            series:[{
                type:'bar',data:top15Long.map((r,i)=>({
                    value: r.total_long,
                    itemStyle:{color:COLORS[i%12]}
                })),
                barWidth:16,
                label:{show:true,position:'right',fontSize:10,color:'#94a3b8',formatter:p=>fmt(p.value)}
            }]
        });
    }, 100);
}

function renderCross(c) {
    c.innerHTML = `
      <div class="card"><h3>席位持仓趋势追踪</h3>
        <div class="seat-selector" id="seatSelector"></div>
        <div class="chart full" id="crossChart"></div>
      </div>
    `;

    // Build seat selector chips
    const selector = document.getElementById('seatSelector');
    const top10 = DATA.seat_agg.slice(0, 10);
    selector.innerHTML = '<span style="color:var(--dim);font-size:12px;margin-right:8px;">选择席位:</span>' +
        top10.map((s,i) => `<div class="seat-chip ${!selectedSeatForTrend || selectedSeatForTrend===s.party_name ? 'active' : ''}" onclick="selectSeatForTrend('${s.party_name}', this)">${s.party_name}</div>`).join('') +
        `<div class="seat-chip ${selectedSeatForTrend === 'all' ? 'active' : ''}" onclick="selectSeatForTrend('all', this)">全部对比</div>`;

    setTimeout(()=>{
        if (selectedSeatForTrend === 'all' || !selectedSeatForTrend) {
            // Show all top10 trends
            const series = [];
            top10.forEach((s,i) => {
                const trend = DATA.trends[s.party_name];
                if (trend) {
                    series.push({name: s.party_name, type:'line', data: trend.net_trend, smooth:true, showSymbol:false, lineStyle:{width:1.5, color:COLORS[i%12]}});
                }
            });
            initChart('crossChart', {
                tooltip:{trigger:'axis'},
                legend:{data:top10.map(s=>s.party_name), textStyle:{color:'#636e85',fontSize:10}, top:0, itemWidth:12, itemHeight:6},
                grid:{left:50,right:20,top:40,bottom:30},
                xAxis:{type:'category',data:top10[0]?.dates?.map(d=>d.slice(4))||[],axisLine:{lineStyle:{color:'#3a4566'}},axisLabel:{color:'#636e85',fontSize:9,rotate:45}},
                yAxis:{type:'value',splitLine:{lineStyle:{color:'#1e293b'}},axisLabel:{formatter:v=>fmtShort(v),color:'#636e85'}},
                series
            });
        } else {
            const trend = DATA.trends[selectedSeatForTrend];
            if (trend) {
                initChart('crossChart', {
                    tooltip:{trigger:'axis'},
                    legend:{data:['多头','空头','净持仓'],textStyle:{color:'#636e85'},top:0},
                    grid:{left:50,right:80,top:35,bottom:30},
                    xAxis:{type:'category',data:trend.dates.map(d=>d.slice(4)),axisLine:{lineStyle:{color:'#3a4566'}},axisLabel:{color:'#636e85',fontSize:9,rotate:45}},
                    yAxis:{type:'value',splitLine:{lineStyle:{color:'#1e293b'}},axisLabel:{formatter:v=>fmtShort(v),color:'#636e85'}},
                    series:[
                        {name:'多头',type:'line',data:trend.long_trend,smooth:true,showSymbol:false,lineStyle:{width:2,color:'#3b82f6'}},
                        {name:'空头',type:'line',data:trend.short_trend,smooth:true,showSymbol:false,lineStyle:{width:2,color:'#ef4444'}},
                        {name:'净持仓',type:'line',data:trend.net_trend,smooth:true,showSymbol:false,lineStyle:{width:2,color:'#22c55e',type:'dashed'},
                         areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color: trend.net_trend[trend.net_trend.length-1]>=0?'#22c55e30':'#ef444430'},{offset:1,color:'transparent'}])}}
                    ]
                });
            }
        }
    }, 100);
}

function selectSeatForTrend(seat, el) {
    selectedSeatForTrend = seat;
    document.querySelectorAll('.seat-chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    const container = document.getElementById('container');
    renderCross(container);
}

function renderTrend(c) {
    c.innerHTML = `
      <div class="card"><h3>Top10席位 多头 vs 空头 对比</h3>
        <div class="chart full" id="trendChart"></div>
      </div>
      <div class="card"><h3>席位持仓量级散点图</h3>
        <div class="chart" id="scatterChart"></div>
      </div>
    `;

    setTimeout(()=>{
        const top10 = DATA.seat_agg.slice(0, 10);

        // Bar chart: long vs short
        const names = top10.map(s=>s.party_name).reverse();
        initChart('trendChart', {
            tooltip:{trigger:'axis',axisPointer:{type:'shadow'}},
            legend:{data:['多头','空头'],textStyle:{color:'#636e85'},top:0},
            grid:{left:100,right:60,top:35,bottom:30},
            xAxis:{type:'value',axisLabel:{formatter:v=>fmtShort(v),color:'#636e85'},splitLine:{lineStyle:{color:'#1e293b'}}},
            yAxis:{type:'category',data:names, axisLabel:{color:'#c8d6e5',fontSize:10}},
            series:[
                {name:'多头',type:'bar',data:top10.map(s=>s.total_long),itemStyle:{color:'#3b82f6'},barWidth:16},
                {name:'空头',type:'bar',data:top10.map(s=>s.total_short),itemStyle:{color:'#ef4444'},barWidth:16}
            ]
        });

        // Scatter: long vs short
        const scatterData = top10.map(s=>([s.total_long, s.total_short, s.party_name, s.net]));
        initChart('scatterChart', {
            tooltip:{
                formatter:p=>`${p.data[2]}<br/>多头: ${fmtShort(p.data[0])}<br/>空头: ${fmtShort(p.data[1])}<br/>净: ${fmtShort(p.data[3])}`
            },
            grid:{left:50,right:20,top:20,bottom:40},
            xAxis:{name:'多头',nameTextStyle:{color:'#636e85'},splitLine:{lineStyle:{color:'#1e293b'}},axisLabel:{formatter:v=>fmtShort(v),color:'#636e85'}},
            yAxis:{name:'空头',nameTextStyle:{color:'#636e85'},splitLine:{lineStyle:{color:'#1e293b'}},axisLabel:{formatter:v=>fmtShort(v),color:'#636e85'}},
            series:[{
                type:'scatter',
                data: scatterData,
                symbolSize: d => Math.max(15, Math.sqrt(d[0]+d[1])/20),
                itemStyle: p => ({
                    color: scatterData[p.dataIndex][3] >= 0 ? '#22c55e' : '#ef4444',
                    shadowBlur: 10,
                    shadowColor: 'rgba(0,0,0,.3)'
                }),
                label:{show:true,formatter:p=>p.data[2],position:'top',color:'#c8d6e5',fontSize:10}
            }]
        });
    }, 100);
}

function renderHints(c) {
    const hints = DATA.hints || [];

    let hintHtml = '';
    if (hints.length === 0) {
        hintHtml = '<div style="text-align:center;padding:30px;color:var(--dim)">暂无明显的投机/套保信号</div>';
    } else {
        hintHtml = hints.map(h => {
            const tagClass = h.type === '单边看多' ? 'tag-bullish' : h.type === '单边看空' ? 'tag-bearish' : 'tag-directional';
            const netColor = h.net >= 0 ? 'up' : 'down';
            return `<div class="hint-card">
                <span class="tag ${tagClass}">${h.type}</span>
                <span class="hint-net ${netColor}">${fmtShort(h.net)}</span>
                <span style="margin-left:8px;color:var(--dim)">${h.party_name}</span>
                <div style="margin-top:4px;color:var(--dim);font-size:11px">${h.reason}</div>
            </div>`;
        }).join('');
    }

    c.innerHTML = `
      <div class="card"><h3>投机/套保识别信号</h3>
        <p style="font-size:12px;color:var(--dim);margin-bottom:16px">
            基于席位长期持仓模式自动识别。单边持仓持续30天以上且无反向持仓 → 可能为单边投机；多空均衡且高换手 → 可能为套利/套保。
        </p>
        ${hintHtml}
      </div>

      <div class="card"><h3>识别逻辑说明</h3>
        <table style="font-size:12px">
        <thead><tr><th>信号类型</th><th>判定条件</th><th>含义</th></tr></thead>
        <tbody>
        <tr><td><span class="tag tag-bullish">单边看多</span></td><td>仅持多单无空单，持续>30天</td><td>强烈看多，单边投机</td></tr>
        <tr><td><span class="tag tag-bearish">单边看空</span></td><td>仅持空单无多单，持续>30天</td><td>强烈看空，单边投机</td></tr>
        <tr><td><span class="tag tag-directional">偏方向性</span></td><td>净持仓占比>30%</td><td>方向性较强，单边倾向</td></tr>
        </tbody></table>
      </div>
    `;
}

window.addEventListener('resize', () => { Object.values(charts).forEach(c=>{if(c&&!c.isDisposed())c.resize();}); });

loadAll();
document.addEventListener('keydown',e=>{ if(e.key==='F12'||(e.ctrlKey&&['c','s','p'].includes(e.key)))e.preventDefault(); });
document.addEventListener('contextmenu',e=>e.preventDefault());
</script>
</body>
</html>
