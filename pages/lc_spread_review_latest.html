<script>
// ===== 全局数据 =====
const PAIRS = JSON.parse(document.getElementById('pairs-data').textContent);
const SUMMARIES = JSON.parse(document.getElementById('summaries-data').textContent);
let currentPair = PAIRS[0] ? PAIRS[0].key : '';

// ===== 摘要 =====
(function(){
    var c = document.getElementById('summary-cards');
    if(!SUMMARIES.length) return;
    var s = SUMMARIES[0];
    var h = '';
    h += '<div class="card"><div class="label">日期</div><div class="value">'+s.date+'</div></div>';
    h += '<div class="card"><div class="label">合约对</div><div class="value">'+s.pair+'</div></div>';
    var sp = s.spread||0;
    var cls = sp>=0?'positive':'negative';
    h += '<div class="card"><div class="label">月差</div><div class="value '+cls+'">'+sp+' 元</div><div class="sub">'+s.structure+'</div></div>';
    h += '<div class="card"><div class="label">主导逻辑</div><div class="value">'+s.dominant_logic+'</div></div>';
    var scores = s.logic_scores||{};
    for(var k in scores){
        var v = scores[k];
        var c2 = v>=0?'positive':'negative';
        h += '<div class="card"><div class="label">'+k+'</div><div class="value '+c2+'">'+(v>=0?'+':'')+v+'</div></div>';
    }
    c.innerHTML = h;
})();

// ===== 合约对标签 =====
(function(){
    var t = document.getElementById('pair-tabs');
    t.innerHTML = PAIRS.map(function(p){
        return '<div class="pair-tab'+(p.key===currentPair?' active':'')+'" data-pair="'+p.key+'" onclick="switchPair(\''+p.key+'\')">'+p.label+'</div>';
    }).join('');
})();

function switchPair(pk){
    currentPair = pk;
    var tabs = document.querySelectorAll('.pair-tab');
    for(var i=0;i<tabs.length;i++) tabs[i].classList.toggle('active', tabs[i].getAttribute('data-pair')===pk);
    renderAll();
}

function renderAll(){
    var pd = null;
    for(var i=0;i<PAIRS.length;i++){ if(PAIRS[i].key===currentPair){ pd=PAIRS[i]; break; } }
    if(!pd) return;
    renderSpreadChart(pd);
    renderLogicChart(pd);
    renderGanttChart(pd);
    renderTable(pd);
}

function renderSpreadChart(pd){
    var dom = document.getElementById('spread-chart');
    var inst = echarts.getInstanceByDom(dom);
    if(inst) inst.dispose();
    dom.innerHTML = '';
    var chart = echarts.init(dom, null, {renderer:'canvas'});
    var sd = pd.spread_data;
    var dates = sd.map(function(d){return d.date;});
    var vals = sd.map(function(d){return d.spread;});
    chart.setOption({
        backgroundColor:'transparent',
        tooltip:{trigger:'axis',backgroundColor:'#161b22',borderColor:'#30363d',textStyle:{color:'#c9d1d9',fontSize:12}},
        legend:{data:['月差'],textStyle:{color:'#8b949e',fontSize:11},top:0},
        grid:{left:'3%',right:'4%',bottom:'3%',top:'12%',containLabel:true},
        xAxis:{type:'category',data:dates,axisLabel:{color:'#8b949e',fontSize:10,rotate:45},axisLine:{lineStyle:{color:'#30363d'}},axisTick:{show:false}},
        yAxis:{type:'value',name:'月差(元)',nameTextStyle:{color:'#8b949e',fontSize:11},axisLabel:{color:'#8b949e'},splitLine:{lineStyle:{color:'#21262d'}},axisLine:{show:false}},
        series:[
            {name:'月差',type:'line',data:vals,smooth:true,symbol:'none',lineStyle:{width:2,color:'#58a6ff'},areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(88,166,255,0.3)'},{offset:1,color:'rgba(88,166,255,0.05)'}])}},
            {name:'零线',type:'line',data:vals.map(function(){return 0;}),symbol:'none',lineStyle:{color:'#484f58',type:'dashed',width:1}}
        ],
        dataZoom:[{type:'inside',start:0,end:100},{show:true,top:'96%',start:0,end:100}]
    }, true);
}

function renderLogicChart(pd){
    var dom = document.getElementById('logic-chart');
    var inst = echarts.getInstanceByDom(dom);
    if(inst) inst.dispose();
    dom.innerHTML = '';
    var chart = echarts.init(dom, null, {renderer:'canvas'});
    var dates = pd.dates;
    var series = [];
    var namesCN = pd.logic_names_cn;
    var colors = pd.logic_colors;
    for(var k in pd.logic_series){
        series.push({
            name: namesCN[k]||k,
            type:'line', data:pd.logic_series[k], smooth:true, symbol:'none',
            lineStyle:{width:1.5, color:colors[k]||'#58a6ff'},
            markLine:{silent:true, data:[{yAxis:0, lineStyle:{color:'#484f58',type:'dashed'}}]}
        });
    }
    chart.setOption({
        backgroundColor:'transparent',
        tooltip:{trigger:'axis',backgroundColor:'#161b22',borderColor:'#30363d',textStyle:{color:'#c9d1d9',fontSize:12}},
        legend:{data:series.map(function(s){return s.name;}),textStyle:{color:'#8b949e',fontSize:11},top:0,type:'scroll'},
        grid:{left:'3%',right:'4%',bottom:'3%',top:'12%',containLabel:true},
        xAxis:{type:'category',data:dates,axisLabel:{color:'#8b949e',fontSize:10,rotate:45},axisLine:{lineStyle:{color:'#30363d'}},axisTick:{show:false}},
        yAxis:{type:'value',name:'得分(-10~+10)',nameTextStyle:{color:'#8b949e',fontSize:11},min:-10,max:10,axisLabel:{color:'#8b949e'},splitLine:{lineStyle:{color:'#21262d'}},axisLine:{show:false}},
        series:series,
        dataZoom:[{type:'inside',start:0,end:100},{show:true,top:'96%',start:0,end:100}]
    }, true);
}

function renderGanttChart(pd){
    var dom = document.getElementById('gantt-chart');
    var inst = echarts.getInstanceByDom(dom);
    if(inst) inst.dispose();
    dom.innerHTML = '';
    var chart = echarts.init(dom, null, {renderer:'canvas'});
    var dates = pd.dates;
    var dominant = pd.dominant_series;
    var colors = pd.logic_colors;
    var namesCN = pd.logic_names_cn;
    var ribbonColors = dominant.map(function(d){return colors[d]||'#58a6ff';});
    chart.setOption({
        backgroundColor:'transparent',
        tooltip:{trigger:'axis',backgroundColor:'#161b22',borderColor:'#30363d',textStyle:{color:'#c9d1d9',fontSize:12},
            formatter:function(p){
                if(!p||!p.length)return '';
                var i=p[0].dataIndex;
                return dates[i]+'<br/>主导逻辑: '+dominant[i];
            }
        },
        grid:{left:'3%',right:'4%',bottom:'3%',top:'5%',containLabel:true},
        xAxis:{type:'category',data:dates,axisLabel:{color:'#8b949e',fontSize:10,rotate:45},axisLine:{lineStyle:{color:'#30363d'}},axisTick:{show:false}},
        yAxis:{type:'category',data:['主导逻辑'],axisLabel:{show:false},axisLine:{show:false},axisTick:{show:false}},
        series:[{
            type:'bar', barWidth:'100%',
            data:dominant.map(function(d,i){return {value:1, itemStyle:{color:ribbonColors[i],opacity:0.8}};}),
            label:{show:true, formatter:function(p){var i=p.dataIndex; return namesCN[dominant[i]]||dominant[i];}, color:'#c9d1d9', fontSize:9},
        }],
        dataZoom:[{type:'inside',start:0,end:100},{show:true,top:'96%',start:0,end:100}]
    }, true);
}

function renderTable(pd){
    var header = document.getElementById('signal-header');
    var body = document.getElementById('signal-body');
    var h = '<th>日期</th><th>月差</th><th>主导逻辑</th>';
    for(var k in pd.logic_names_cn){ h += '<th>'+pd.logic_names_cn[k]+'</th>'; }
    header.innerHTML = h;
    var spreadMap = {};
    pd.spread_data.forEach(function(d){spreadMap[d.date]=d.spread;});
    var rows = '';
    for(var i=pd.dates.length-1;i>=0;i--){
        var d=pd.dates[i]; var dom=pd.dominant_series[i]; var sp=spreadMap[d]||0;
        var sc=sp>=0?'positive':'negative';
        var r = '<td>'+d+'</td><td class="'+sc+'">'+sp+'</td><td>'+dom+'</td>';
        for(var k in pd.logic_series){
            var v=pd.logic_series[k][i];
            var c2=v>0.1?'signal-positive':(v<-0.1?'signal-negative':'signal-neutral');
            r += '<td class="'+c2+'">'+(v>=0?'+':'')+v+'</td>';
        }
        rows += '<tr>'+r+'</tr>';
    }
    body.innerHTML = rows;
}

renderAll();
</script>
