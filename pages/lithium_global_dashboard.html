<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔋 全球锂矿 Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px}
.header{background:linear-gradient(90deg,#16213e,#0f3460);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #e94560}
.header h1{font-size:20px;color:#fff}
.header .sub{color:#8899aa;font-size:12px;margin-top:2px}
.btn{background:#e94560;color:#fff;border:none;padding:7px 14px;border-radius:4px;cursor:pointer;font-size:12px}
.btn:hover{background:#ff6b6b}
.tabs{display:flex;background:#16213e;border-bottom:1px solid #333}
.tab{padding:10px 18px;cursor:pointer;color:#8899aa;border-bottom:2px solid transparent;font-size:13px;transition:.2s}
.tab:hover{color:#fff;background:#1a1a3e}
.tab.active{color:#e94560;border-bottom-color:#e94560;background:#1a1a3e}
.tc{display:none;padding:16px}.tc.active{display:block}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.card{background:#16213e;border-radius:6px;padding:14px;border:1px solid #1f2b47}
.ct{font-size:13px;color:#e94560;margin-bottom:10px;font-weight:600}
.ch{width:100%;height:280px}.ch-lg{height:380px}
.mets{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:12px}
.met{background:#16213e;border-radius:6px;padding:12px;text-align:center;border:1px solid #1f2b47}
.met .v{font-size:26px;font-weight:700;color:#00b4d8}
.met .l{font-size:11px;color:#8899aa;margin-top:3px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#0f3460;color:#fff;padding:7px 8px;text-align:left;cursor:pointer;position:sticky;top:0}
td{padding:5px 8px;border-bottom:1px solid #1f2b47}
tr:hover{background:#1a1a3e}
.tw{max-height:350px;overflow-y:auto}
.badge{display:inline-block;padding:1px 6px;border-radius:8px;font-size:10px;color:#fff}
.b-exp{background:#533483}.b-pln{background:#0f3460}.b-fea{background:#00b4d8}
.b-con{background:#e94560}.b-pre{background:#f0a500}.b-opr{background:#28a745}
.ic{background:#1a1a3e;border-radius:4px;padding:10px;margin-bottom:6px;border-left:3px solid #e94560}
.ic .f{font-size:12px;color:#ddd;margin-bottom:4px}
.ic .r{font-size:11px;color:#8899aa}
</style>
</head>
<body>
<div class="header">
<div><h1>🔋 全球锂矿 Dashboard</h1><div class="sub">硬岩管道 · 非洲锂矿 · 盐湖跟踪 · 分析洞见 · 市场行情</div></div>
<button class="btn" onclick="refreshAll()">⟳ 刷新全部</button>
</div>
<div class="tabs">
<div class="tab active" data-i="0">📊 总览</div>
<div class="tab" data-i="1">⛏️ 硬岩管道</div>
<div class="tab" data-i="2">🌍 非洲锂矿</div>
<div class="tab" data-i="3">🧂 盐湖跟踪</div>
<div class="tab" data-i="4">🔍 分析洞见</div>
<div class="tab" data-i="5">📈 市场行情</div>
</div>
<div id="metrics" class="mets"></div>
<!-- Tab 0 -->
<div class="tc active" id="tab0">
<div class="g2">
<div class="card"><div class="ct">📈 碳酸锂价格走势 (近90天)</div><div id="c_price" class="ch"></div></div>
<div class="card"><div class="ct">🏗️ 项目阶段分布</div><div id="c_stages" class="ch"></div></div>
</div>
<div class="g2">
<div class="card"><div class="ct">🌏 项目国家分布</div><div id="c_countries" class="ch"></div></div>
<div class="card"><div class="ct">📊 盐湖产能排名 Top10</div><div id="c_salt_top" class="ch"></div></div>
</div>
</div>
<!-- Tab 1 -->
<div class="tc" id="tab1">
<div class="g2">
<div class="card"><div class="ct">🔄 开发阶段分布</div><div id="c_funnel" class="ch"></div></div>
<div class="card"><div class="ct">🌏 各国项目数</div><div id="c_hr_countries" class="ch"></div></div>
</div>
<div class="card"><div class="ct">📋 硬岩管道项目明细</div><div class="tw" id="t_pipeline"></div></div>
</div>
<!-- Tab 2 -->
<div class="tc" id="tab2">
<div class="g2">
<div class="card"><div class="ct">🌍 非洲各国项目数</div><div id="c_africa" class="ch"></div></div>
<div class="card"><div class="ct">🎯 开发阶段分布</div><div id="c_africa_stage" class="ch"></div></div>
</div>
<div class="card"><div class="ct">📋 非洲锂矿项目明细</div><div class="tw" id="t_africa"></div></div>
</div>
<!-- Tab 3 -->
<div class="tc" id="tab3">
<div class="g2">
<div class="card"><div class="ct">📊 盐湖产能排名</div><div id="c_salt_cap" class="ch-lg"></div></div>
<div class="card"><div class="ct">💰 C1 成本曲线</div><div id="c_cost" class="ch-lg"></div></div>
</div>
<div class="g2">
<div class="card"><div class="ct">🏦 CAPEX Top10</div><div id="c_capex" class="ch"></div></div>
<div class="card"><div class="ct">📋 盐湖明细</div><div class="tw" id="t_salt"></div></div>
</div>
</div>
<!-- Tab 4 -->
<div class="tc" id="tab4">
<div class="g2">
<div class="card"><div class="ct">⚠️ 信号严重程度</div><div id="c_severity" class="ch"></div></div>
<div class="card"><div class="ct">📋 分析类型分布</div><div id="c_atypes" class="ch"></div></div>
</div>
<div class="card"><div class="ct">💡 分析洞见</div><div class="tw" id="t_analysis"></div></div>
</div>
<!-- Tab 5 -->
<div class="tc" id="tab5">
<div class="g2">
<div class="card"><div class="ct">📈 期货 K 线 (近180天)</div><div id="c_kline" class="ch-lg"></div></div>
<div class="card"><div class="ct">📊 持仓量走势</div><div id="c_hold" class="ch-lg"></div></div>
</div>
<div class="card"><div class="ct">📋 近期行情</div><div class="tw" id="t_market"></div></div>
</div>

<script>const API_BASE = 'http://124.221.113.37:8766/lithium-api';

// Anti-copy
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{if((e.ctrlKey&&['c','s','p'].includes(e.key))||e.key==='F12')e.preventDefault()});
document.body.style.userSelect='none';

const API=API_BASE + '/lithium';
const tabs=document.querySelectorAll('.tab');
const tabContents=document.querySelectorAll('.tc');
const charts={};

function switchTab(i){
  tabs.forEach((t,j)=>{t.classList.toggle('active',j===i);tabContents[j].classList.toggle('active',j===i)});
  if(i===0)loadOverview();else if(i===1)loadPipeline();else if(i===2)loadAfrica();
  else if(i===3)loadSalt();else if(i===4)loadAnalysis();else if(i===5)loadMarket();
}
tabs.forEach((t,i)=>t.addEventListener('click',()=>switchTab(i)));

function initChart(id){
  const el=document.getElementById(id);
  if(!el)return null;
  const c=echarts.init(el,'dark');charts[id]=c;return c;
}
function showL(c){c.showLoading({text:'加载中',color:'#e94560',maskColor:'#16213e'})}
function hideL(c){c.hideLoading()}

async function fetchJ(url){try{const r=await fetch(url);return await r.json()}catch(e){console.error(e);return null}}

function sBadge(s){
  const m={'exploration':['探索','#533483'],'planning':['规划','#0f3460'],'feasibility':['可研','#00b4d8'],
    'construction':['建设','#e94560'],'pre-production':['试产','#f0a500'],'operating':['运营','#28a745']};
  const[x,c]=m[s]||[s,'#888'];return`<span class="badge" style="background:${c}">${x}</span>`;
}

// Metrics
async function loadMetrics(){
  const[pipe,af,sl,an,qs]=await Promise.all([
    fetchJ(`${API}/pipeline`),fetchJ(`${API}/africa`),fetchJ(`${API}/salt_lake`),
    fetchJ(`${API}/analysis`),fetchJ(`${API}/quotes`)
  ]);
  const saltP=new Set((sl&&sl.data||[]).map(d=>d.project_name)).size;
  const highA=(an&&an.data||[]).filter(d=>d.severity==='high').length;
  const lp=(qs&&qs.data&&qs.data[0])?`¥${(qs.data[0].close/10000).toFixed(2)}w`:'--';
  document.getElementById('metrics').innerHTML=`
    <div class="met"><div class="v">${pipe?pipe.data.length:0}</div><div class="l">硬岩管道</div></div>
    <div class="met"><div class="v">${af?af.data.length:0}</div><div class="l">非洲项目</div></div>
    <div class="met"><div class="v">${saltP}</div><div class="l">盐湖项目</div></div>
    <div class="met"><div class="v" style="color:#e94560">${highA}</div><div class="l">高风险信号</div></div>
    <div class="met"><div class="v">${lp}</div><div class="l">期货最新价</div></div>`;
}

async function refreshAll(){loadMetrics();switchTab(0)}
</script>

<script>
async function loadOverview(){
  const[qs,pipe,sl]=await Promise.all([fetchJ(`${API}/quotes`),fetchJ(`${API}/pipeline`),fetchJ(`${API}/salt_lake`)]);
  
  // Price line
  const c1=initChart('c_price');showL(c1);
  if(qs&&qs.data){
    const d=qs.data.slice(-90).reverse();
    c1.setOption({tooltip:{trigger:'axis',backgroundColor:'#16213e',borderColor:'#333',textStyle:{color:'#fff'}},
      grid:{left:50,right:20,top:30,bottom:30},
      xAxis:{type:'category',data:d.map(r=>r.date),axisLine:{lineStyle:{color:'#333'}},axisLabel:{color:'#8899aa',interval:Math.floor(d.length/10)}},
      yAxis:{type:'value',name:'元/吨',nameTextStyle:{color:'#8899aa'},axisLine:{lineStyle:{color:'#333'}},splitLine:{lineStyle:{color:'#222'}},axisLabel:{color:'#8899aa'}},
      series:[{name:'收盘',type:'line',data:d.map(r=>r.close),smooth:true,lineStyle:{color:'#00b4d8',width:2},
        areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(0,180,216,0.3)'},{offset:1,color:'rgba(0,180,216,0)'}])},itemStyle:{color:'#00b4d8'}}]
    });
  }hideL(c1);

  // Stages
  const c2=initChart('c_stages');showL(c2);
  if(pipe&&pipe.data){
    const sc={};pipe.data.forEach(p=>{sc[p.development_stage]=(sc[p.development_stage]||0)+1});
    const colors=['#533483','#0f3460','#00b4d8','#e94560','#f0a500','#28a745'];
    c2.setOption({tooltip:{trigger:'axis',backgroundColor:'#16213e',borderColor:'#333',textStyle:{color:'#fff'}},
      grid:{left:100,right:40,top:10,bottom:10},
      xAxis:{type:'value',axisLine:{lineStyle:{color:'#333'}},splitLine:{lineStyle:{color:'#222'}},axisLabel:{color:'#8899aa'}},
      yAxis:{type:'category',data:Object.keys(sc),axisLine:{lineStyle:{color:'#333'}},axisLabel:{color:'#8899aa'}},
      series:[{name:'项目数',type:'bar',data:Object.values(sc),barWidth:20,
        itemStyle:{color:p=>colors[p.dataIndex%colors.length]}}]
    });
  }hideL(c2);

  // Countries pie
  const c3=initChart('c_countries');showL(c3);
  if(pipe&&pipe.data){
    const cc={};pipe.data.forEach(p=>{cc[p.country]=(cc[p.country]||0)+1});
    const sorted=Object.entries(cc).sort((a,b)=>b[1]-a[1]);
    c3.setOption({tooltip:{trigger:'item',backgroundColor:'#16213e',borderColor:'#333',textStyle:{color:'#fff'}},
      series:[{type:'pie',radius:['40%','70%'],center:['50%','55%'],
        data:sorted.map(([n,v])=>({name:n,value:v})),label:{color:'#ccc',formatter:'{b}: {c}'}
      }]
    });
  }hideL(c3);

  // Salt top
  const c4=initChart('c_salt_top');showL(c4);
  if(sl&&sl.data){
    const caps={};sl.data.forEach(s=>{const k=s.project_name;if(s.lce_annualized_kt)caps[k]=Math.max(caps[k]||0,s.lce_annualized_kt)});
    const top=Object.entries(caps).sort((a,b)=>b[1]-a[1]).slice(0,10);
    c4.setOption({tooltip:{trigger:'axis',backgroundColor:'#16213e',borderColor:'#333',textStyle:{color:'#fff'}},
      grid:{left:180,right:60,top:10,bottom:10},
      xAxis:{type:'value',name:'kt/yr',nameTextStyle:{color:'#8899aa'},axisLine:{lineStyle:{color:'#333'}},splitLine:{lineStyle:{color:'#222'}},axisLabel:{color:'#8899aa'}},
      yAxis:{type:'category',data:top.map(x=>x[0].substring(0,25)),inverse:true,axisLine:{lineStyle:{color:'#333'}},axisLabel:{color:'#8899aa',fontSize:11}},
      series:[{name:'产能',type:'bar',data:top.map(x=>x[1]),barWidth:16,
        itemStyle:{color:new echarts.graphic.LinearGradient(0,0,1,0,[{offset:0,color:'#e94560'},{offset:1,color:'#00b4d8'}])}}]
    });
  }hideL(c4);
}
</script>

<script>
// Tab 1: Hard Rock Pipeline
async function loadPipeline(){
  const pipe=await fetchJ(`${API}/pipeline`);
  if(!pipe||!pipe.data)return;
  
  // Funnel
  const c1=initChart('c_funnel');showL(c1);
  const sc={};pipe.data.forEach(p=>{sc[p.development_stage]=(sc[p.development_stage]||0)+1});
  const order=['exploration','planning','feasibility','construction','pre-production','operating'];
  const fd=order.map(s=>({name:s,value:sc[s]||0})).filter(x=>x.value>0);
  c1.setOption({tooltip:{trigger:'item',backgroundColor:'#16213e',borderColor:'#333',textStyle:{color:'#fff'}},
    series:[{type:'funnel',left:'10%',right:'10%',top:20,bottom:20,width:'80%',
      data:fd,label:{color:'#fff'},itemStyle:{borderColor:'#1a1a2e',borderWidth:2}}]
  });hideL(c1);

  // Countries
  const c2=initChart('c_hr_countries');showL(c2);
  const cc={};pipe.data.forEach(p=>{cc[p.country]=(cc[p.country]||0)+1});
  const sorted=Object.entries(cc).sort((a,b)=>b[1]-a[1]);
  c2.setOption({tooltip:{trigger:'axis',backgroundColor:'#16213e',borderColor:'#333',textStyle:{color:'#fff'}},
    grid:{left:100,right:40,top:10,bottom:10},
    xAxis:{type:'value',axisLine:{lineStyle:{color:'#333'}},splitLine:{lineStyle:{color:'#222'}},axisLabel:{color:'#8899aa'}},
    yAxis:{type:'category',data:sorted.map(x=>x[0]),axisLine:{lineStyle:{color:'#333'}},axisLabel:{color:'#8899aa'}},
    series:[{name:'项目数',type:'bar',data:sorted.map(x=>x[1]),barWidth:16,itemStyle:{color:'#0f3460'}}]
  });hideL(c2);

  // Table
  const cols=['company_name','country','development_stage','resource_type','lce_mton','start_year','est_capex_usd_m'];
  let t='<table><tr>'+cols.map(c=>'<th>'+c+'</th>').join('')+'</tr>';
  pipe.data.forEach(p=>{t+='<tr>';cols.forEach(c=>{
    t+=c==='development_stage'?`<td>${sBadge(p[c])}</td>`:`<td>${(p[c]!=null?p[c]:'--').toString().substring(0,40)}</td>`});t+='</tr>'});
  t+='</table>';
  document.getElementById('t_pipeline').innerHTML=t;
}

// Tab 2: Africa
async function loadAfrica(){
  const af=await fetchJ(`${API}/africa`);
  if(!af||!af.data)return;

  // Countries
  const c1=initChart('c_africa');showL(c1);
  const cc={};af.data.forEach(a=>{cc[a.country]=(cc[a.country]||0)+1});
  const sorted=Object.entries(cc).sort((a,b)=>b[1]-a[1]);
  c1.setOption({tooltip:{trigger:'item',backgroundColor:'#16213e',borderColor:'#333',textStyle:{color:'#fff'}},
    series:[{type:'pie',radius:['40%','70%'],center:['50%','55%'],
      data:sorted.map(([n,v])=>({name:n,value:v})),label:{color:'#ccc',formatter:'{b}: {c}'}
    }]
  });hideL(c1);

  // Stages
  const c2=initChart('c_africa_stage');showL(c2);
  const sc={};af.data.forEach(a=>{sc[a.development_stage]=(sc[a.development_stage]||0)+1});
  const colors=['#533483','#0f3460','#00b4d8','#e94560','#f0a500','#28a745'];
  c2.setOption({tooltip:{trigger:'axis',backgroundColor:'#16213e',borderColor:'#333',textStyle:{color:'#fff'}},
    grid:{left:100,right:40,top:10,bottom:10},
    xAxis:{type:'value',axisLine:{lineStyle:{color:'#333'}},splitLine:{lineStyle:{color:'#222'}},axisLabel:{color:'#8899aa'}},
    yAxis:{type:'category',data:Object.keys(sc),axisLine:{lineStyle:{color:'#333'}},axisLabel:{color:'#8899aa'}},
    series:[{name:'项目数',type:'bar',data:Object.values(sc),barWidth:20,
      itemStyle:{color:p=>colors[p.dataIndex%colors.length]}}]
  });hideL(c2);

  // Table
  const cols=['company_name','country','development_stage','resource_type','lce_mton','status'];
  let t='<table><tr>'+cols.map(c=>'<th>'+c+'</th>').join('')+'</tr>';
  af.data.forEach(a=>{t+='<tr>';cols.forEach(c=>{
    t+=c==='development_stage'?`<td>${sBadge(a[c])}</td>`:`<td>${(a[c]!=null?a[c]:'--')}</td>`});t+='</tr>'});
  t+='</table>';
  document.getElementById('t_africa').innerHTML=t;
}
</script>

<script>
// Tab 3: Salt Lake
async function loadSalt(){
  const sl=await fetchJ(`${API}/salt_lake`);
  if(!sl||!sl.data)return;

  // Capacity
  const c1=initChart('c_salt_cap');showL(c1);
  const caps={};sl.data.forEach(s=>{const k=s.project_name;if(s.lce_annualized_kt)caps[k]=Math.max(caps[k]||0,s.lce_annualized_kt)});
  const top=Object.entries(caps).sort((a,b)=>b[1]-a[1]);
  c1.setOption({tooltip:{trigger:'axis',backgroundColor:'#16213e',borderColor:'#333',textStyle:{color:'#fff'}},
    grid:{left:180,right:60,top:10,bottom:30},
    xAxis:{type:'value',name:'kt/yr',nameTextStyle:{color:'#8899aa'},axisLine:{lineStyle:{color:'#333'}},splitLine:{lineStyle:{color:'#222'}},axisLabel:{color:'#8899aa'}},
    yAxis:{type:'category',data:top.map(x=>x[0].substring(0,30)),inverse:true,axisLine:{lineStyle:{color:'#333'}},axisLabel:{color:'#8899aa',fontSize:11}},
    series:[{name:'产能',type:'bar',data:top.map(x=>x[1]),barWidth:14,
      itemStyle:{color:new echarts.graphic.LinearGradient(0,0,1,0,[{offset:0,color:'#e94560'},{offset:1,color:'#00b4d8'}])}}]
  );hideL(c1);

  // C1 Cost
  const c2=initChart('c_cost');showL(c2);
  const cc={};sl.data.forEach(s=>{const k=s.project_name;if(s.c1_cost_usd_t&&k)cc[k]=Math.min(cc[k]||999,s.c1_cost_usd_t)});
  const cost=Object.entries(cc).sort((a,b)=>a[1]-b[1]);
  c2.setOption({tooltip:{trigger:'axis',backgroundColor:'#16213e',borderColor:'#333',textStyle:{color:'#fff'}},
    grid:{left:80,right:40,top:10,bottom:40},
    xAxis:{type:'category',data:cost.map(x=>x[0].substring(0,15)),axisLine:{lineStyle:{color:'#333'}},axisLabel:{color:'#8899aa',rotate:45}},
    yAxis:{type:'value',name:'$/t',nameTextStyle:{color:'#8899aa'},axisLine:{lineStyle:{color:'#333'}},splitLine:{lineStyle:{color:'#222'}},axisLabel:{color:'#8899aa'}},
    series:[{name:'C1成本',type:'bar',data:cost.map(x=>x[1]),barWidth:16,
      itemStyle:{color:p=>x=>{const v=x.value;return v<800?'#28a745':v<1200?'#f0a500':'#e94560'}},
      label:{show:true,position:'top',color:'#fff',formatter:p=>p.value+'$'}}]
  );hideL(c2);

  // CAPEX
  const c3=initChart('c_capex');showL(c3);
  const cx={};sl.data.forEach(s=>{const k=s.project_name;if(s.quarterly_capex_usd_m)cx[k]=(cx[k]||0)+s.quarterly_capex_usd_m});
  const ct=Object.entries(cx).sort((a,b)=>b[1]-a[1]).slice(0,10);
  c3.setOption({tooltip:{trigger:'axis',backgroundColor:'#16213e',borderColor:'#333',textStyle:{color:'#fff'}},
    grid:{left:180,right:60,top:10,bottom:10},
    xAxis:{type:'value',name:'$M',nameTextStyle:{color:'#8899aa'},axisLine:{lineStyle:{color:'#333'}},splitLine:{lineStyle:{color:'#222'}},axisLabel:{color:'#8899aa'}},
    yAxis:{type:'category',data:ct.map(x=>x[0].substring(0,25)),inverse:true,axisLine:{lineStyle:{color:'#333'}},axisLabel:{color:'#8899aa',fontSize:11}},
    series:[{name:'CAPEX',type:'bar',data:ct.map(x=>x[1]),barWidth:16,itemStyle:{color:'#0f3460'}}]
  );hideL(c3);

  // Table
  const cols=['project_name','company_name','country','quarter','lce_annualized_kt','c1_cost_usd_t','quarterly_capex_usd_m'];
  let t='<table><tr>'+cols.map(c=>'<th>'+c+'</th>').join('')+'</tr>';
  const seen=new Set();sl.data.forEach(s=>{const k=s.project_name+'|'+s.quarter;if(seen.has(k))return;seen.add(k);
    t+='<tr>';cols.forEach(c=>{t+=`<td>${(s[c]!=null?s[c]:'--')}</td>`});t+='</tr>'});
  t+='</table>';
  document.getElementById('t_salt').innerHTML=t;
}

// Tab 4: Analysis
async function loadAnalysis(){
  const an=await fetchJ(`${API}/analysis`);
  if(!an||!an.data)return;

  // Severity
  const c1=initChart('c_severity');showL(c1);
  const sc={};an.data.forEach(a=>{sc[a.severity]=(sc[a.severity]||0)+1});
  const sevColors={high:'#e94560',medium:'#f0a500',low:'#00b4d8'};
  c1.setOption({tooltip:{trigger:'item',backgroundColor:'#16213e',borderColor:'#333',textStyle:{color:'#fff'}},
    series:[{type:'pie',radius:['40%','70%'],center:['50%','55%'],
      data:Object.entries(sc).map(([k,v])=>({name:k==='high'?'🔴高':k==='medium'?'🟡中':'🟢低',value:v})),
      label:{color:'#ccc',formatter:'{b}: {c}'},itemStyle:{color:p=>sevColors[Object.keys(sc)[p.dataIndex]]||'#888'}}]
  );hideL(c1);

  // Types
  const c2=initChart('c_atypes');showL(c2);
  const tc={};an.data.forEach(a=>{tc[a.analysis_type]=(tc[a.analysis_type]||0)+1});
  const ts=Object.entries(tc).sort((a,b)=>b[1]-a[1]);
  c2.setOption({tooltip:{trigger:'axis',backgroundColor:'#16213e',borderColor:'#333',textStyle:{color:'#fff'}},
    grid:{left:140,right:40,top:10,bottom:10},
    xAxis:{type:'value',axisLine:{lineStyle:{color:'#333'}},splitLine:{lineStyle:{color:'#222'}},axisLabel:{color:'#8899aa'}},
    yAxis:{type:'category',data:ts.map(x=>x[0]),axisLine:{lineStyle:{color:'#333'}},axisLabel:{color:'#8899aa',fontSize:11}},
    series:[{name:'数量',type:'bar',data:ts.map(x=>x[1]),barWidth:14,itemStyle:{color:'#533483'}}]
  );hideL(c2);

  // Cards
  let h='';an.data.forEach(a=>{
    const sc=a.severity==='high'?'#e94560':a.severity==='medium'?'#f0a500':'#00b4d8';
    h+=`<div class="ic" style="border-left-color:${sc}"><div class="f">
      <span class="badge" style="background:${sc}">${a.severity==='high'?'🔴高':a.severity==='medium'?'🟡中':'🟢低'}</span>
      ${a.project_name||'-'} | ${a.analysis_type||'-'} | ${a.date||'-'}
    </div><div class="r">${(a.recommendation||'').substring(0,200)}</div></div>`;
  });
  document.getElementById('t_analysis').innerHTML=h;
}
</script>

<script>
// Tab 5: Market
async function loadMarket(){
  const[qs,pos]=await Promise.all([fetchJ(`${API}/quotes`),fetchJ(`${API}/position`)]);

  // K-line
  const c1=initChart('c_kline');showL(c1);
  if(qs&&qs.data){
    const d=qs.data.slice(-180).reverse();
    const kdata=d.map(r=>[r.open||0,r.high||0,r.low||0,r.close||0,r.volume||0]);
    c1.setOption({tooltip:{trigger:'axis',backgroundColor:'#16213e',borderColor:'#333',textStyle:{color:'#fff'}},
      grid:[{left:60,right:60,top:30,height:'55%'},
            {left:60,right:60,top:'70%',height:'20%'}],
      xAxis:[{type:'category',data:d.map(r=>r.date),axisLine:{lineStyle:{color:'#333'}},axisLabel:{color:'#8899aa',interval:Math.floor(d.length/15)},
              gridIndex:0},
             {type:'category',data:d.map(r=>r.date),axisLine:{lineStyle:{color:'#333'}},axisLabel:{show:false},gridIndex:1}],
      yAxis:[{type:'value',name:'元/吨',nameTextStyle:{color:'#8899aa'},scale:true,axisLine:{lineStyle:{color:'#333'}},
              splitLine:{lineStyle:{color:'#222'}},axisLabel:{color:'#8899aa'},gridIndex:0},
             {type:'value',name:'成交量',nameTextStyle:{color:'#8899aa'},scale:true,axisLine:{lineStyle:{color:'#333'}},
              splitLine:{lineStyle:{color:'#222'}},axisLabel:{color:'#8899aa'},gridIndex:1}],
      series:[{name:'K线',type:'candlestick',data:kdata,
        itemStyle:{color:'#e94560',color0:'#28a745',borderColor:'#e94560',borderColor0:'#28a745'}},
        {name:'成交量',type:'bar',data:d.map(r=>({value:r.volume||0,
          itemStyle:{color:(r.close>=r.open)?'#28a745':'#e94560'}})),
         xAxisIndex:1,yAxisIndex:1,barWidth:6}]
    });
  }hideL(c1);

  // Holdings
  const c2=initChart('c_hold');showL(c2);
  if(pos&&pos.data){
    const d=pos.data.slice(-90).reverse();
    const longD=d.filter(r=>r.position_type==='long');
    const shortD=d.filter(r=>r.position_type==='short');
    c2.setOption({tooltip:{trigger:'axis',backgroundColor:'#16213e',borderColor:'#333',textStyle:{color:'#fff'}},
      grid:{left:60,right:20,top:30,bottom:30},
      xAxis:{type:'category',data:longD.map(r=>r.date),axisLine:{lineStyle:{color:'#333'}},axisLabel:{color:'#8899aa',interval:Math.floor(longD.length/12)}},
      yAxis:{type:'value',name:'手',nameTextStyle:{color:'#8899aa'},axisLine:{lineStyle:{color:'#333'}},splitLine:{lineStyle:{color:'#222'}},axisLabel:{color:'#8899aa'}},
      series:[{name:'多仓',type:'line',data:longD.map(r=>r.open_interest||0),smooth:true,
              lineStyle:{color:'#e94560'},itemStyle:{color:'#e94560'}},
        {name:'空仓',type:'line',data:shortD.map(r=>r.open_interest||0),smooth:true,
              lineStyle:{color:'#00b4d8'},itemStyle:{color:'#00b4d8'}}]
    });
  }hideL(c2);

  // Market table
  if(qs&&qs.data){
    const cols=['date','open','high','low','close','volume','open_interest','change'];
    const recent=qs.data.slice(-20).reverse();
    let t='<table><tr>'+cols.map(c=>'<th>'+c+'</th>').join('')+'</tr>';
    recent.forEach(r=>{t+='<tr>';cols.forEach(c=>{
      const v=r[c];t+=c==='change'?`<td style="color:${v>=0?'#28a745':'#e94560'}">${v!=null?((v>=0?'+':'')+v):''}</td>`:`<td>${(v!=null?v:'--')}</td>`});t+='</tr>'});
    t+='</table>';
    document.getElementById('t_market').innerHTML=t;
  }
}

// Init on load
window.addEventListener('DOMContentLoaded',()=>{
  loadMetrics();loadOverview();
});

// Resize
window.addEventListener('resize',()=>{Object.values(charts).forEach(c=>c.resize())});
</script>
